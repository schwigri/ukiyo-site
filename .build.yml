{
  "$schema": "https://www.schemastore.org/sourcehut-build-0.65.0.json",
  "image": "alpine/latest",
  "oauth": "pages.sr.ht/PAGES:RW",
  "packages": ["hut", "icu-data-full", "nodejs", "npm"],
  "submitter": { "git.sr.ht": { "allow-refs": ["refs/heads/main"], "enabled": true } },
  "tasks":
    [
      { "build": "cd ukiyo-site \n npm ci \n npm run prerelease \n npm run build" },
      { "package": "cd ukiyo-site \n tar -C dist -cvz . > site.tar.gz" },
      { "upload": "cd ukiyo-site \n hut pages publish -d www.griffen.dev site.tar.gz" },
    ],
}
